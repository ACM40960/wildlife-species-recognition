name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch/torchvision to keep CI fast and small
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check (compile all sources)
        run: python -m compileall src scripts tests

      - name: Lint (flake8)
        run: flake8 src scripts tests

      - name: Unit tests + tiny training smoke test
        run: pytest -q
