[flake8]
max-line-length = 100
# E203/W503 conflict with common formatters; E114/E116 allow aligned inline comments.
extend-ignore = E203, W503, E114, E116
exclude = .git,__pycache__,.cct_cache,data,results,.venv
per-file-ignores =
    # scripts and tests intentionally set sys.path before importing the package.
    tests/*: E402
    scripts/*: E402
